name: Deploy API
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. On va dans le dossier API pour récupérer le code
            cd ~/chasse-aux-sorcieres/api
            git pull origin main

            # 2. On remonte au dossier parent pour lancer Docker
            cd ..

            # 3. On ne reconstruit QUE l'API (--build api)
            docker compose up -d --build api

            # 4. Nettoyage
            docker image prune -f
